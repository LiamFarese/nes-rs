name: Security & Dependency Checks

on:
  push:
    branches: [master]
    paths: ['**/Cargo.toml', '**/Cargo.lock']

  pull_request:
    branches: [master]
    paths: ['**/Cargo.toml', '**/Cargo.lock']

  schedule:
    - cron: '0 12 * * 1'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
